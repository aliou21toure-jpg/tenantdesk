openapi: 3.1.0
info:
  title: TenantDesk API
  version: 1.0.0
  description: |
    Multi-tenant invoicing API. Every business resource lives under an organization
    (`/orgs/{orgId}/...`). Access requires a Bearer access token and a membership
    in that organization; what you can do depends on your role.

    | Permission | viewer | member | admin | owner |
    |---|:-:|:-:|:-:|:-:|
    | Read clients, invoices, members | ✓ | ✓ | ✓ | ✓ |
    | Create/edit clients and invoices | | ✓ | ✓ | ✓ |
    | Delete clients, change invoice status, read audit log | | | ✓ | ✓ |
    | Add/remove lower-ranked members | | | ✓ | ✓ |
    | Change roles | | | | ✓ |
servers:
  - url: http://localhost:4000
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    orgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed, unauthenticated, forbidden, not_found, conflict] }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }
    Role: { type: string, enum: [owner, admin, member, viewer] }
    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        email: { type: [string, "null"], format: email }
        created_at: { type: string, format: date-time }
    InvoiceItem:
      type: object
      required: [description, quantity, unit_price_cents]
      properties:
        description: { type: string, maxLength: 500 }
        quantity: { type: integer, minimum: 1 }
        unit_price_cents: { type: integer, minimum: 0, description: Money is always integer cents }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        number: { type: integer, description: Sequential per organization }
        status: { type: string, enum: [draft, sent, paid, void] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        issue_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        total_cents: { type: integer, description: Computed by the server }
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceItem" } }
  responses:
    BadRequest: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Your role lacks the permission, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found — also returned for organizations you are not a member of, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
paths:
  /health:
    get: { security: [], summary: Database health check, responses: { "200": { description: OK } } }
  /auth/register:
    post:
      security: []
      summary: Create an account and its first organization (caller becomes owner)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, organization]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 12 }
                organization: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email already registered }
        "429": { description: Too many attempts }
  /auth/login:
    post:
      security: []
      summary: Exchange email + password for tokens
      requestBody: { content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      security: []
      summary: Rotate a refresh token. Reusing an old one revokes the whole session.
      requestBody: { content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses:
        "200": { description: New token pair, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      security: []
      summary: Revoke the session
      requestBody: { content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses: { "204": { description: Revoked } }
  /me:
    get: { summary: Current user and their organizations, responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /orgs:
    post: { summary: Create another organization (caller becomes owner), responses: { "201": { description: Created } } }
  /orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get: { summary: Organization details (org:read), responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    patch: { summary: Rename (org:update), responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /orgs/{orgId}/members:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get: { summary: List members, responses: { "200": { description: OK } } }
    post:
      summary: Add an existing user (members:manage). Cannot grant a role above your own.
      requestBody: { content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, role: { type: string, enum: [admin, member, viewer] } } } } } }
      responses: { "201": { description: Added }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { description: No such user } }
  /orgs/{orgId}/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/orgId" }, { name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Change role (owner only, not your own)
      requestBody: { content: { application/json: { schema: { type: object, properties: { role: { $ref: "#/components/schemas/Role" } } } } } }
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Forbidden" } }
    delete: { summary: Remove a lower-ranked member, or leave the organization yourself, responses: { "204": { description: Removed } } }
  /orgs/{orgId}/clients:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get: { summary: List clients, parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }], responses: { "200": { description: OK } } }
    post:
      summary: Create a client (clients:write)
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, email: { type: string } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Client" } } } } }
  /orgs/{orgId}/clients/{clientId}:
    parameters: [{ $ref: "#/components/parameters/orgId" }, { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Get a client, responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    patch: { summary: Update a client, responses: { "200": { description: OK } } }
    delete: { summary: Delete a client (clients:delete). 409 if it has invoices., responses: { "204": { description: Deleted }, "409": { description: Has invoices } } }
  /orgs/{orgId}/invoices:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      summary: List invoices, newest number first
      parameters: [{ name: status, in: query, schema: { type: string, enum: [draft, sent, paid, void] } }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a draft invoice; the server computes the total
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_id, items]
              properties:
                client_id: { type: string, format: uuid }
                currency: { type: string, default: CAD }
                due_date: { type: string, format: date }
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/InvoiceItem" } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } } }
  /orgs/{orgId}/invoices/{invoiceId}:
    parameters: [{ $ref: "#/components/parameters/orgId" }, { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Invoice with line items, responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } } } }
  /orgs/{orgId}/invoices/{invoiceId}/status:
    parameters: [{ $ref: "#/components/parameters/orgId" }, { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: "Change status (invoices:change_status). Allowed: draft→sent|void, sent→paid|void"
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [sent, paid, void] } } } } } }
      responses: { "200": { description: OK }, "409": { description: Invalid transition } }
  /orgs/{orgId}/audit:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get: { summary: Append-only audit log (audit:read), parameters: [{ $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/offset" }], responses: { "200": { description: OK } } }
